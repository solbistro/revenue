<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>餐廳營收分析儀表板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0f1117;
            --card: #1a1d27;
            --border: #2a2d3e;
            --text: #e2e8f0;
            --muted: #8892a4;
            --accent: #6366f1;
            --green: #10b981;
            --red: #ef4444;
            --yellow: #f59e0b;
            --blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #1e1b4b 0%, #1a1d27 100%);
            border-bottom: 1px solid var(--border);
            padding: 20px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header span {
            font-size: 0.8rem;
            color: var(--muted);
            margin-left: auto;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 28px 24px;
        }

        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .kpi {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 24px;
            position: relative;
            overflow: hidden;
        }

        .kpi::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
        }

        .kpi.purple::before {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
        }

        .kpi.green::before {
            background: linear-gradient(90deg, #10b981, #34d399);
        }

        .kpi.yellow::before {
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
        }

        .kpi.blue::before {
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
        }

        .kpi-label {
            font-size: 0.75rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .kpi-value {
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1;
        }

        .kpi-sub {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 6px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 999px;
            margin-top: 6px;
        }

        .badge.up {
            background: rgba(16, 185, 129, .15);
            color: #34d399;
        }

        .badge.down {
            background: rgba(239, 68, 68, .15);
            color: #f87171;
        }

        /* Charts grid */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 2fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .full {
            margin-bottom: 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
        }

        .card-sub {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 2px;
        }

        select {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.78rem;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: var(--accent);
        }

        canvas {
            max-height: 300px;
        }

        .chart-tall canvas {
            max-height: 360px;
        }

        /* Day of week bars */
        .dow-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .dow-item {
            text-align: center;
        }

        .dow-bar-wrap {
            height: 120px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            margin-bottom: 6px;
        }

        .dow-bar {
            width: 32px;
            border-radius: 4px 4px 0 0;
            transition: opacity .2s;
        }

        .dow-label {
            font-size: 0.7rem;
            color: var(--muted);
        }

        .dow-value {
            font-size: 0.68rem;
            color: var(--text);
            margin-top: 2px;
            font-weight: 600;
        }

        /* Top items table */
        .item-table {
            width: 100%;
            border-collapse: collapse;
        }

        .item-table th {
            font-size: 0.7rem;
            color: var(--muted);
            text-align: left;
            padding: 6px 10px;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        .item-table td {
            font-size: 0.8rem;
            padding: 8px 10px;
            border-bottom: 1px solid rgba(42, 45, 62, .5);
        }

        .item-table tr:last-child td {
            border-bottom: none;
        }

        .item-table tr:hover td {
            background: rgba(99, 102, 241, .05);
        }

        .rank {
            font-size: 0.7rem;
            color: var(--muted);
            font-weight: 700;
        }

        .rank-1 {
            color: #fbbf24;
        }

        .rank-2 {
            color: #9ca3af;
        }

        .rank-3 {
            color: #b45309;
        }

        .cat-badge {
            display: inline-block;
            padding: 1px 7px;
            border-radius: 999px;
            font-size: 0.65rem;
            background: rgba(99, 102, 241, .2);
            color: #a5b4fc;
        }

        .bar-mini {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bar-mini-bg {
            flex: 1;
            height: 5px;
            background: var(--border);
            border-radius: 3px;
        }

        .bar-mini-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 4px;
        }

        .tab {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            border: 1px solid transparent;
            color: var(--muted);
            transition: all .15s;
        }

        .tab.active {
            background: rgba(99, 102, 241, .2);
            border-color: rgba(99, 102, 241, .4);
            color: #818cf8;
        }

        .tab:hover:not(.active) {
            background: rgba(255, 255, 255, .05);
        }

        /* Category layout */
        .cat-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 32px;
            align-items: center;
        }

        .cat-chart-wrap canvas {
            max-height: 280px;
        }

        .cat-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .cat-row {
            display: grid;
            grid-template-columns: 12px 1fr 72px 72px 52px;
            align-items: center;
            gap: 10px;
            padding: 5px 0;
            border-bottom: 1px solid rgba(42,45,62,.4);
        }

        .cat-row:last-child { border-bottom: none; }

        .cat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

        .cat-name { font-size: 0.82rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .cat-bar-wrap { position: relative; height: 6px; background: var(--border); border-radius: 3px; }
        .cat-bar-fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 3px; }

        .cat-rev { font-size: 0.78rem; color: var(--text); text-align: right; font-weight: 600; white-space: nowrap; }
        .cat-qty { font-size: 0.75rem; color: var(--muted); text-align: right; white-space: nowrap; }
        .cat-pct { font-size: 0.75rem; color: var(--muted); text-align: right; white-space: nowrap; }

        .cat-group-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0 6px 10px;
            margin: 6px 0 2px;
            background: rgba(255,255,255,.03);
            border-radius: 0 6px 6px 0;
        }

        .cat-group-title { font-size: 0.78rem; font-weight: 700; }
        .cat-group-sub { font-size: 0.72rem; color: var(--muted); margin-left: auto; }
        .cat-group-pct { font-size: 0.78rem; font-weight: 700; min-width: 42px; text-align: right; }

        @media (max-width: 900px) {
            .cat-layout { grid-template-columns: 1fr; }
        }

        /* Split layout */
        .split-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto;
            gap: 20px;
            margin-bottom: 20px;
            align-items: stretch;
        }

        .split-left {
            display: grid;
            grid-template-rows: 1fr 2fr;
            gap: 20px;
        }

        .split-top,
        .split-bottom {
            min-height: 0;
        }

        .split-right {
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 900px) {
            .kpi-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .grid-2,
            .grid-3,
            .split-layout {
                grid-template-columns: 1fr;
            }

            .split-left {
                grid-template-rows: auto auto;
            }
        }
    </style>
</head>

<body>
    <header>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        <div>
            <h1>餐廳營收分析儀表板</h1>
        </div>
        <span id="data-range"></span>
    </header>

    <div class="container">
        <!-- KPI Cards -->
        <div class="kpi-grid" id="kpi-grid"></div>

        <!-- Monthly Revenue Trend -->
        <div class="full card chart-tall">
            <div class="card-header">
                <div>
                    <div class="card-title">每月營收趨勢</div>
                    <div class="card-sub">營業淨額 vs 折扣金額</div>
                </div>
                <div class="tabs">
                    <div class="tab active" onclick="setMonthlyView('revenue')">營收</div>
                    <div class="tab" onclick="setMonthlyView('receipts')">來客數</div>
                    <div class="tab" onclick="setMonthlyView('avg')">每日平均</div>
                </div>
            </div>
            <canvas id="monthlyChart"></canvas>
        </div>

        <div class="split-layout">
            <!-- Left column -->
            <div class="split-left">
                <!-- 33% height: Day of Week -->
                <div class="card split-top">
                    <div class="card-header">
                        <div class="card-title">星期別平均營收</div>
                        <div class="card-sub">2025全年統計</div>
                    </div>
                    <div class="dow-grid" id="dow-grid"></div>
                </div>
                <!-- 66% height: Daily Revenue -->
                <div class="card split-bottom">
                    <div class="card-header">
                        <div>
                            <div class="card-title">每日營收走勢</div>
                        </div>
                        <select id="daily-month-sel" onchange="renderDailyChart()"></select>
                    </div>
                    <canvas id="dailyChart"></canvas>
                </div>
            </div>
            <!-- Right column: Top Items full height -->
            <div class="card split-right">
                <div class="card-header">
                    <div class="card-title">熱銷品項 Top 15</div>
                    <div class="card-sub">依營業額排序</div>
                </div>
                <select id="item-month-sel" onchange="renderItemTable()" style="margin-bottom:14px"></select>
                <div id="item-table-wrap" style="overflow-y:auto;flex:1"></div>
            </div>
        </div>

        <div class="full card" style="margin-top:20px">
            <div class="card-header">
                <div>
                    <div class="card-title">品類銷售分布</div>
                    <div class="card-sub">按月份篩選</div>
                </div>
                <select id="cat-month-sel" onchange="renderCategoryChart()"></select>
            </div>
            <div class="cat-layout">
                <div class="cat-chart-wrap">
                    <canvas id="categoryChart"></canvas>
                </div>
                <div class="cat-list" id="cat-list"></div>
            </div>
        </div>
    </div>
    <script>
        // ════════════════════════════════════════════════════════════
        // Load data
        // ════════════════════════════════════════════════════════════
        let DATA = null;

        async function loadData() {
            const res = await fetch('data.json');
            DATA = await res.json();
            init();
        }

        function fmt(n) {
            if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
            return n.toFixed(0);
        }
        function fmtFull(n) { return '$' + Math.round(n).toLocaleString(); }
        function monthLabel(m) {
            const [y, mo] = m.split('-');
            return y + '/' + mo;
        }

        // ════════════════════════════════════════════════════════════
        // Init
        // ════════════════════════════════════════════════════════════
        function init() {
            const monthly = DATA.monthly;
            const first = monthly[0].month, last = monthly[monthly.length - 1].month;
            document.getElementById('data-range').textContent = `資料期間：${first} ～ ${last}`;

            renderKPI();
            renderMonthlyChart('revenue');
            setupSelects();
            renderCategoryChart();
            renderDailyChart();
            renderDOW();
            renderItemTable();
        }

        // ════════════════════════════════════════════════════════════
        // KPI
        // ════════════════════════════════════════════════════════════
        function renderKPI() {
            const m = DATA.monthly;
            const totalRev = m.reduce((s, r) => s + r.revenue, 0);
            const totalDisc = m.reduce((s, r) => s + r.discount, 0);
            const totalReceipts = m.reduce((s, r) => s + r.receipts, 0);
            const days = DATA.daily.length;
            const avgDaily = totalRev / days;

            // MoM for last full month
            const last = m[m.length - 1], prev = m[m.length - 2];
            const mom = prev ? ((last.revenue - prev.revenue) / prev.revenue * 100).toFixed(1) : null;

            const kpis = [
                { label: '全期總營收', value: fmtFull(totalRev), sub: `共 ${m.length} 個月 ${days} 個營業日`, cls: 'purple', badge: mom ? { v: mom, up: mom > 0 } : null },
                { label: '日均營收', value: fmtFull(avgDaily), sub: '含所有營業日平均', cls: 'green' },
                { label: '總折扣金額', value: fmtFull(totalDisc), sub: `佔總營收 ${(totalDisc / totalRev * 100).toFixed(1)}%`, cls: 'yellow' },
                { label: '總來客數', value: totalReceipts.toLocaleString(), sub: `平均每日 ${(totalReceipts / days).toFixed(0)} 張發票`, cls: 'blue' },
            ];

            const grid = document.getElementById('kpi-grid');
            grid.innerHTML = kpis.map(k => `
    <div class="kpi ${k.cls}">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value">${k.value}</div>
      ${k.badge ? `<div class="badge ${k.badge.up ? 'up' : 'down'}">${k.badge.up ? '▲' : '▼'} ${Math.abs(k.badge.v)}% MoM</div>` : ''}
      <div class="kpi-sub">${k.sub}</div>
    </div>
  `).join('');
        }

        // ════════════════════════════════════════════════════════════
        // Monthly Chart
        // ════════════════════════════════════════════════════════════
        let monthlyChart = null;
        let monthlyView = 'revenue';

        function setMonthlyView(v) {
            monthlyView = v;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderMonthlyChart(v);
        }

        function renderMonthlyChart(view) {
            const m = DATA.monthly;
            const labels = m.map(r => monthLabel(r.month));
            let dataset1, dataset2, label1, label2;

            if (view === 'revenue') {
                dataset1 = m.map(r => r.revenue);
                dataset2 = m.map(r => r.discount);
                label1 = '營業淨額'; label2 = '折扣金額';
            } else if (view === 'receipts') {
                dataset1 = m.map(r => r.receipts);
                dataset2 = null;
                label1 = '發票張數（來客數）';
            } else {
                dataset1 = m.map(r => Math.round(r.revenue / r.days));
                dataset2 = null;
                label1 = '日均營收';
            }

            const datasets = [{
                label: label1,
                data: dataset1,
                type: 'bar',
                backgroundColor: 'rgba(99,102,241,.6)',
                borderColor: '#6366f1',
                borderWidth: 1,
                borderRadius: 4,
                yAxisID: 'y',
            }];

            if (dataset2) datasets.push({
                label: label2,
                data: dataset2,
                type: 'line',
                borderColor: '#f59e0b',
                backgroundColor: 'rgba(245,158,11,.15)',
                borderWidth: 2,
                pointRadius: 4,
                tension: 0.3,
                fill: true,
                yAxisID: 'y2',
            });

            if (monthlyChart) monthlyChart.destroy();
            monthlyChart = new Chart(document.getElementById('monthlyChart'), {
                type: 'bar',
                data: { labels, datasets },
                options: {
                    responsive: true, maintainAspectRatio: true,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { labels: { color: '#8892a4', font: { size: 11 } } },
                        tooltip: {
                            backgroundColor: '#1a1d27',
                            borderColor: '#2a2d3e',
                            borderWidth: 1,
                            titleColor: '#e2e8f0',
                            bodyColor: '#8892a4',
                            callbacks: {
                                label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString()}`
                            }
                        }
                    },
                    scales: {
                        x: { grid: { color: 'rgba(42,45,62,.5)' }, ticks: { color: '#8892a4', font: { size: 11 } } },
                        y: { grid: { color: 'rgba(42,45,62,.5)' }, ticks: { color: '#8892a4', font: { size: 11 }, callback: v => '$' + fmt(v) } },
                        ...(dataset2 ? { y2: { position: 'right', grid: { display: false }, ticks: { color: '#f59e0b', font: { size: 11 }, callback: v => '$' + fmt(v) } } } : {}),
                    }
                }
            });
        }

        // ════════════════════════════════════════════════════════════
        // Setup Selects
        // ════════════════════════════════════════════════════════════
        function setupSelects() {
            // Category months
            const catSel = document.getElementById('cat-month-sel');
            Object.keys(DATA.category).sort().forEach(m => {
                catSel.innerHTML += `<option value="${m}">${monthLabel(m)}</option>`;
            });
            catSel.value = Object.keys(DATA.category).sort().pop();

            // Daily months
            const dailySel = document.getElementById('daily-month-sel');
            const months = [...new Set(DATA.daily.map(d => d.date.slice(0, 7)))].sort();
            months.forEach(m => { dailySel.innerHTML += `<option value="${m}">${monthLabel(m)}</option>`; });
            dailySel.value = months[months.length - 1];

            // Item months
            const itemSel = document.getElementById('item-month-sel');
            Object.keys(DATA.items).sort().forEach(m => {
                itemSel.innerHTML += `<option value="${m}">${monthLabel(m)}</option>`;
            });
            itemSel.value = Object.keys(DATA.items).sort().pop();
        }

        // ════════════════════════════════════════════════════════════
        // Category Donut
        // ════════════════════════════════════════════════════════════

        // 品類分組：飲品（藍紫色系）/ 餐點（暖色系）/ 其他（灰色系）
        const DRINK_CATS = new Set(['經典','啤酒','茶飲','GIN','無酒精飲品','咖啡','SHOT','TEQUILA','WHISKY','VODKA','紅白氣泡酒','RUM']);
        const FOOD_CATS  = new Set(['配酒小點','義大利麵','披薩','沙拉點心','西班牙大鍋飯']);
        const DRINK_PALETTE = ['#6366f1','#8b5cf6','#a78bfa','#3b82f6','#06b6d4','#0ea5e9','#818cf8','#60a5fa','#c084fc','#22d3ee','#9333ea','#38bdf8'];
        const FOOD_PALETTE  = ['#f97316','#fb923c','#fbbf24','#f59e0b','#84cc16','#a3e635','#10b981','#34d399','#14b8a6'];
        const OTHER_PALETTE = ['#6b7280','#9ca3af','#4b5563'];

        function getCatColor(name, drinkIdx, foodIdx, otherIdx) {
            if (DRINK_CATS.has(name)) return DRINK_PALETTE[drinkIdx % DRINK_PALETTE.length];
            if (FOOD_CATS.has(name))  return FOOD_PALETTE[foodIdx % FOOD_PALETTE.length];
            return OTHER_PALETTE[otherIdx % OTHER_PALETTE.length];
        }

        // Legacy alias for item table cat-badge colors
        const CAT_COLORS = [
            '#6366f1','#8b5cf6','#a78bfa','#c084fc','#e879f9',
            '#3b82f6','#06b6d4','#10b981','#f59e0b','#ef4444',
            '#f97316','#84cc16','#14b8a6','#ec4899','#6b7280',
        ];

        let catChart = null;
        function renderCategoryChart() {
            const month = document.getElementById('cat-month-sel').value;
            const cats = DATA.category[month] || [];
            const total = cats.reduce((s, c) => s + c.revenue, 0);

            // Assign colors per category
            let di = 0, fi = 0, oi = 0;
            const colored = cats.map(c => {
                let color;
                if (DRINK_CATS.has(c.name))      { color = DRINK_PALETTE[di++ % DRINK_PALETTE.length]; }
                else if (FOOD_CATS.has(c.name))  { color = FOOD_PALETTE[fi++ % FOOD_PALETTE.length]; }
                else                              { color = OTHER_PALETTE[oi++ % OTHER_PALETTE.length]; }
                return { ...c, color };
            });

            // Donut
            if (catChart) catChart.destroy();
            catChart = new Chart(document.getElementById('categoryChart'), {
                type: 'doughnut',
                data: {
                    labels: colored.map(c => c.name),
                    datasets: [{
                        data: colored.map(c => c.revenue),
                        backgroundColor: colored.map(c => c.color),
                        borderColor: '#1a1d27',
                        borderWidth: 2,
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: true,
                    cutout: '62%',
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#1a1d27', borderColor: '#2a2d3e', borderWidth: 1,
                            titleColor: '#e2e8f0', bodyColor: '#8892a4',
                            callbacks: {
                                label: ctx => {
                                    const pct = (ctx.parsed / total * 100).toFixed(1);
                                    return ` $${ctx.parsed.toLocaleString()} (${pct}%)`;
                                }
                            }
                        }
                    }
                }
            });

            // ── Grouped list ──────────────────────────────────────────
            const drinks = colored.filter(c => DRINK_CATS.has(c.name));
            const foods  = colored.filter(c => FOOD_CATS.has(c.name));
            const others = colored.filter(c => !DRINK_CATS.has(c.name) && !FOOD_CATS.has(c.name));

            const drinkRev = drinks.reduce((s,c)=>s+c.revenue,0);
            const foodRev  = foods.reduce((s,c)=>s+c.revenue,0);
            const otherRev = others.reduce((s,c)=>s+c.revenue,0);
            const maxRev   = Math.max(drinkRev, foodRev, 1);

            function groupSection(title, groupColor, items, groupRev) {
                const groupPct = total ? (groupRev / total * 100).toFixed(1) : 0;
                const itemMaxRev = items[0]?.revenue || 1;
                const rows = items.map(c => {
                    const pct = total ? (c.revenue / total * 100).toFixed(1) : 0;
                    const barPct = (c.revenue / itemMaxRev * 100).toFixed(1);
                    return `
                    <div class="cat-row">
                        <div class="cat-dot" style="background:${c.color}"></div>
                        <div>
                            <div class="cat-name">${c.name}</div>
                            <div class="cat-bar-wrap" style="margin-top:4px">
                                <div class="cat-bar-fill" style="width:${barPct}%;background:${c.color};opacity:.7"></div>
                            </div>
                        </div>
                        <div class="cat-rev">$${c.revenue.toLocaleString()}</div>
                        <div class="cat-qty">${c.qty.toLocaleString()} 份</div>
                        <div class="cat-pct" style="color:${c.color};font-weight:600">${pct}%</div>
                    </div>`;
                }).join('');
                return `
                <div class="cat-group-header" style="border-left:3px solid ${groupColor}">
                    <span class="cat-group-title" style="color:${groupColor}">${title}</span>
                    <span class="cat-group-sub">$${groupRev.toLocaleString()}</span>
                    <span class="cat-group-pct" style="color:${groupColor}">${groupPct}%</span>
                </div>
                ${rows}`;
            }

            const tableHeader = `
                <div class="cat-row" style="border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:4px">
                    <div></div>
                    <div style="font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">品類</div>
                    <div style="font-size:.7rem;color:var(--muted);text-align:right">營業額</div>
                    <div style="font-size:.7rem;color:var(--muted);text-align:right">銷售量</div>
                    <div style="font-size:.7rem;color:var(--muted);text-align:right">占比</div>
                </div>`;

            document.getElementById('cat-list').innerHTML =
                tableHeader +
                (drinks.length ? groupSection('🍹 飲品', '#6366f1', drinks, drinkRev) : '') +
                (foods.length  ? groupSection('🍽 餐點', '#f97316', foods,  foodRev)  : '') +
                (others.length ? groupSection('📌 其他', '#6b7280', others, otherRev) : '');
        }

        // ════════════════════════════════════════════════════════════
        // Daily Chart
        // ════════════════════════════════════════════════════════════
        let dailyChart = null;
        function renderDailyChart() {
            const month = document.getElementById('daily-month-sel').value;
            const rows = DATA.daily.filter(d => d.date.startsWith(month)).sort((a, b) => a.date.localeCompare(b.date));
            const labels = rows.map(d => d.date.slice(5));
            const values = rows.map(d => d.revenue);

            if (dailyChart) dailyChart.destroy();
            dailyChart = new Chart(document.getElementById('dailyChart'), {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        label: '日營收',
                        data: values,
                        backgroundColor: values.map(v => v > 60000 ? 'rgba(16,185,129,.7)' : v > 30000 ? 'rgba(99,102,241,.7)' : 'rgba(99,102,241,.35)'),
                        borderRadius: 3,
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#1a1d27', borderColor: '#2a2d3e', borderWidth: 1,
                            titleColor: '#e2e8f0', bodyColor: '#8892a4',
                            callbacks: { label: ctx => ` $${ctx.parsed.y.toLocaleString()}` }
                        }
                    },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#8892a4', font: { size: 10 }, maxRotation: 45 } },
                        y: { grid: { color: 'rgba(42,45,62,.5)' }, ticks: { color: '#8892a4', font: { size: 10 }, callback: v => '$' + fmt(v) } }
                    }
                }
            });
        }

        // ════════════════════════════════════════════════════════════
        // Day of Week
        // ════════════════════════════════════════════════════════════
        function renderDOW() {
            const DOW_LABELS = ['週一', '週二', '週三', '週四', '週五', '週六', '週日'];
            const counts = Array(7).fill(0), revs = Array(7).fill(0);
            DATA.daily.forEach(d => {
                const dt = new Date(d.date);
                const w = (dt.getDay() + 6) % 7; // Mon=0
                counts[w]++;
                revs[w] += d.revenue;
            });
            const avgs = counts.map((c, i) => c ? Math.round(revs[i] / c) : 0);
            const maxAvg = Math.max(...avgs);

            const COLORS = ['#6366f1', '#6366f1', '#6366f1', '#6366f1', '#f59e0b', '#10b981', '#10b981'];
            const grid = document.getElementById('dow-grid');
            grid.innerHTML = DOW_LABELS.map((label, i) => {
                const pct = maxAvg ? (avgs[i] / maxAvg * 100) : 0;
                return `
      <div class="dow-item">
        <div class="dow-bar-wrap">
          <div class="dow-bar" style="height:${pct}%;background:${COLORS[i]};opacity:0.8"></div>
        </div>
        <div class="dow-label">${label}</div>
        <div class="dow-value">$${(avgs[i] / 1000).toFixed(0)}K</div>
      </div>
    `;
            }).join('');
        }

        // ════════════════════════════════════════════════════════════
        // Item Table
        // ════════════════════════════════════════════════════════════
        function renderItemTable() {
            const month = document.getElementById('item-month-sel').value;
            const items = DATA.items[month] || [];
            if (!items.length) { document.getElementById('item-table-wrap').innerHTML = '<p style="color:var(--muted);font-size:.8rem">無資料</p>'; return; }
            const maxRev = items[0].revenue;

            const rows = items.map((item, i) => {
                const rank = i < 3 ? `<span class="rank rank-${i + 1}">${['①', '②', '③'][i]}</span>` : `<span class="rank">${i + 1}</span>`;
                const pct = (item.revenue / maxRev * 100).toFixed(0);
                return `
      <tr>
        <td>${rank}</td>
        <td>${item.name}<br><span class="cat-badge">${item.category}</span></td>
        <td style="color:var(--muted)">${item.qty}</td>
        <td>
          <div class="bar-mini">
            <span style="font-size:.8rem;min-width:52px">$${(item.revenue / 1000).toFixed(0)}K</span>
            <div class="bar-mini-bg"><div class="bar-mini-fill" style="width:${pct}%"></div></div>
          </div>
        </td>
      </tr>
    `;
            }).join('');

            document.getElementById('item-table-wrap').innerHTML = `
    <table class="item-table">
      <thead><tr><th>#</th><th>品項</th><th>銷量</th><th>營業額</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
        }

        // Start
        loadData();
    </script>
</body>

</html>
